name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      # Chromium's system packages are mostly fonts the runner image lacks; its libraries are
      # already there. Best effort: Ubuntu's mirrors are at times unreachable from runners, and
      # the pages under test use their own fonts.
      - run: pnpm exec playwright install-deps chromium
        continue-on-error: true
        timeout-minutes: 3
      - run: pnpm e2e
      - run: pnpm shots
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: .screenshots/
          include-hidden-files: true
      # create → new → check → build under a project path, with the packed packages (§18, M4).
      - run: pnpm smoke
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: starter/dist/

  # The starter is the live demo at elucidatejs.github.io/elucidate (docs/spec.md §16).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
